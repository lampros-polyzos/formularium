# Weekly pull requests for out-of-date dependencies, so known vulnerabilities in libraries do not sit unnoticed. Free for every repository.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (the linter) only supports TypeScript below 6.1, so TypeScript 7 makes "npm ci" fail.
      # Remove this rule when a typescript-eslint release accepts TypeScript 7 (check its peerDependencies).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node describes the Node version the build runs on, so its major is chosen by hand together with that version (CI, Vercel), not by a bot.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
