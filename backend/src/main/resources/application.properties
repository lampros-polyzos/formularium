spring.application.name=formularium
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Local settings: backend/.env (copy .env.example). Optional, so hosts that use real environment variables need no file.
spring.config.import=optional:file:.env[.properties]
# Address(es) of the website allowed to call the API; separate several with commas
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Database: any PostgreSQL (the Supabase one, for example). Use the JDBC form of the connection string.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}
# Connection pool. Small, because a hosted database (Supabase) allows only so many connections; connections are replaced every 10 minutes
# and pinged every 4, before a pooler or firewall can silently drop an idle one (which shows up as random failed requests). A connection
# that cannot be had within 10 seconds fails fast instead of hanging the request.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.connection-timeout=10000

# Sign-in. AUTH_JWT_SECRET is required (32+ random characters); the app will not start without it.
auth.jwt-secret=${AUTH_JWT_SECRET:}
auth.issuer=formularium
auth.access-ttl=15m
auth.refresh-ttl=30d
# The OAuth client id of the "Sign in with Google" button. Empty turns Google sign-in off.
auth.google-client-id=${GOOGLE_CLIENT_ID:}
# Cloudflare Turnstile secret key. Empty skips the bot check (development only).
auth.turnstile-secret=${TURNSTILE_SECRET:}
# In production: true, and SameSite Lax when the site and the API share a domain (None when they do not).
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
auth.cookie-same-site=${AUTH_COOKIE_SAMESITE:Lax}

# Email confirmation and password reset.
# Require a confirmed email before signing in (turn off only for development without a mail server).
auth.require-verified-email=${AUTH_REQUIRE_VERIFIED_EMAIL:true}
# Refuse passwords that appear in known data breaches (the free haveibeenpwned.com range service; only a 5-character hash prefix is sent)
auth.breached-password-check=${AUTH_BREACHED_PASSWORD_CHECK:true}
# Two-step verification: base64 of 32 random bytes (openssl rand -base64 32) that encrypts authenticator secrets. Empty switches the feature off.
auth.mfa-encryption-key=${AUTH_MFA_ENCRYPTION_KEY:}
# The website's address: the links in the emails point at it
auth.app-url=${APP_URL:http://localhost:5173}
auth.mail-from=${MAIL_FROM:Formularium <no-reply@localhost>}
# Sending, in this order of preference: Brevo's HTTPS API (BREVO_API_KEY; needed on hosts that block SMTP ports, such as Render's free plan),
# then any SMTP server (MAIL_HOST: Brevo, Resend, Mailgun, Amazon SES, Gmail...). With neither, the emails are only written to the log, links included (development).
mail.brevo-api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Hosting platforms (Render, Fly, Heroku...) say which port to listen on through PORT; 8080 when run locally
server.port=${PORT:8080}
# Finish the requests in progress when the platform stops the app for a new version
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# The real client address behind a proxy (for the sign-in limits and the audit trail): the name of a header the host's proxy sets and visitors cannot forge.
# Render: CF-Connecting-IP. Empty (development): the connection's own address. Never X-Forwarded-For, which a visitor can write (see auth/ClientAddress).
auth.client-ip-header=${CLIENT_IP_HEADER:}

# "Try the demo": temporary guest accounts so nobody has to sign up to look around. Each is deleted after the time below, with everything in it.
# The limits keep it from being abused: a number per address per hour, and a ceiling on how many exist at once. GUEST_ENABLED=false switches it off.
auth.guest.enabled=${GUEST_ENABLED:true}
auth.guest.ttl-hours=${GUEST_TTL_HOURS:24}
auth.guest.max-active=${GUEST_MAX_ACTIVE:200}
auth.guest.per-ip-per-hour=${GUEST_PER_IP_PER_HOUR:10}
