# The database is a PostgreSQL container started by PostgresForTests (connection settings and schema come from there)

auth.jwt-secret=test-secret-test-secret-test-secret-0123456789
auth.issuer=formularium-test
auth.google-client-id=test-client.apps.googleusercontent.com
auth.turnstile-secret=
cors.allowed-origin=http://localhost:5173
spring.jackson.deserialization.fail-on-null-for-primitives=false
auth.require-verified-email=false
# no calls to the real breach service from tests; the checker has its own tests
auth.breached-password-check=false
# a fixed key for the tests only (the bytes 0 to 31)
auth.mfa-encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
auth.app-url=http://localhost:5173
